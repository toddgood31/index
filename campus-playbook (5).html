<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Playbook · Heartland Dental</title>
<style>
:root{
  color-scheme:light dark;
  --navy:#041e41;--gold:#caa977;--blue:#004370;
  --bg:#f3f5f8;--panel:#ffffff;--ink:#0d2140;--muted:#5a6272;--line:#dfe3ea;--soft:#eef1f6;
  --hires:#004370;--target:#caa977;--ok:#2d6e3d;--warn:#ca4512;--bad:#a1263a;--focus:#0065ae;
  --btn-bg:#041e41;--btn-ink:#ffffff;--okbg:#e4f1e7;--warnbg:#fbe9e0;--badbg:#f8e3e6;--infobg:#e3edf6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1220;--panel:#111b2e;--ink:#e7ecf4;--muted:#9ba7bb;--line:#22304a;--soft:#18243b;
    --hires:#5d93c1;--ok:#5fc275;--warn:#ff9a62;--bad:#ff7d8f;--focus:#7db6ee;
    --btn-bg:#caa977;--btn-ink:#041e41;--okbg:#17301f;--warnbg:#3a2418;--badbg:#3a1b22;--infobg:#17283d}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,td.r,th.r{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#nav{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:6px}
.brand{display:flex;flex-direction:column;gap:10px;padding:2px 8px 16px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.brand img{width:132px;height:auto;display:block}
.brand b{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:17px;letter-spacing:0}
.brand span{display:block;font-size:12px;color:#b9c4d6;margin-top:1px}
#nav nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;background:none;border:0;color:#d5deec;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;width:100%}
.nv svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:rgba(255,255,255,.08)}
.nv.on{background:var(--gold);color:var(--navy);font-weight:600}
.nv .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.16);border-radius:10px;padding:0 7px}
.nv.on .cnt{background:rgba(4,30,65,.16)}
.savestate{margin-top:auto;font-size:11.5px;color:#aeb9cc;padding:8px 10px;line-height:1.35}
main{padding:28px 36px 60px;max-width:1280px;width:100%}
.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;line-height:1.1}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input[type=search],.filters input[type=text]{min-width:150px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.panel.pad{padding:18px 20px}
.panel h2{font-size:17px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.grid2.even{grid-template-columns:1fr 1fr}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:34px}
textarea{width:100%;resize:vertical;min-height:70px}
select{padding-right:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600;min-height:34px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;min-height:26px;font-size:12.5px}
.link{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
@media (prefers-color-scheme:dark){.link{color:var(--focus)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:2px;gap:2px}
.seg button,.seg label{border:0;background:none;padding:5px 12px;border-radius:5px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.seg .on{background:var(--btn-bg);color:var(--btn-ink)}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px;overflow:hidden}
.hero>div{padding:22px 26px}
.hero>div+div{border-left:1px solid var(--line)}
.hero .lbl{color:var(--muted);font-weight:600}
.hero .big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:50px;font-weight:700;line-height:1.05;margin:4px 0 12px}
.hero .big small{font-size:20px;color:var(--muted);font-weight:400;font-family:"Segoe UI",system-ui,sans-serif}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hires);border-radius:6px;min-width:0}
.bar.gold i{background:var(--gold)}
.bar.over i{background:var(--warn)}
.hero .meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:13px}
.ledger{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:16px}
.ledger>div{padding:14px 18px}
.ledger>div+div{border-left:1px solid var(--line)}
.ledger .v{font-size:23px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.ledger .k{color:var(--muted);font-size:12.5px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;margin-bottom:16px;background:var(--infobg);border:1px solid var(--line);border-radius:10px}
.banner b{display:block}
.banner span{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:11px;padding:1px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--blue)}
@media (prefers-color-scheme:dark){.chip.info{color:var(--focus)}}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;letter-spacing:.02em}
.tag.DOC{background:var(--infobg);color:var(--blue)}.tag.HYG{background:var(--warnbg);color:var(--warn)}
@media (prefers-color-scheme:dark){.tag.DOC{color:var(--focus)}}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
tfoot td{font-weight:700;background:var(--soft)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.st{border:0;border-radius:11px;font-weight:600;font-size:12px;padding:2px 6px;min-height:0;cursor:pointer}
.st-Planned{background:var(--soft)}.st-Confirmed{background:var(--infobg);color:var(--blue)}.st-Held{background:var(--okbg);color:var(--ok)}.st-Invoiced{background:var(--okbg);color:var(--ok)}.st-Cancelled{background:var(--badbg);color:var(--bad)}
.pill{display:inline-block;border-left:3px solid var(--c,#999);background:var(--soft);padding:1px 7px;border-radius:3px;font-size:12px;white-space:nowrap}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 8px;display:flex;gap:8px;align-items:center}
/* kpi row for events */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:16px}
.kpis>div{padding:12px 18px}.kpis>div+div{border-left:1px solid var(--line)}
.kpis .v{font-size:22px;font-weight:700}.kpis .k{font-size:12.5px;color:var(--muted)}
/* lists */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rows li:last-child{border-bottom:0}
.rows li:hover{background:var(--soft)}
.dt{width:44px;text-align:center;flex:none;line-height:1.1}
.dt b{display:block;font-size:19px}.dt span{font-size:11.5px;color:var(--muted)}
.rows .grow{flex:1;min-width:0}
.rows .grow b,.rows .grow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* donut */
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;transform:rotate(-90deg);flex:none}
.donut svg text{transform:rotate(90deg);transform-origin:21px 21px;fill:var(--ink);font-weight:700}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:140px}
.legend li{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.legend li:hover{text-decoration:underline}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.legend em{margin-left:auto;font-style:normal;font-weight:600}
/* calendar */
.calbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:12px}
.calbar h2{min-width:170px;text-align:center}
.legend-row{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto;max-width:640px}
.legend-row span{display:inline-flex;gap:5px;align-items:center}.legend-row i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}
.cal .dow{padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);background:var(--soft)}
.cal .day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:default;position:relative}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--soft);color:var(--muted)}
.cal .day .n{font-size:12px;font-weight:600;display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px}
.cal .day.today .n{background:var(--btn-bg);color:var(--btn-ink)}
.cal .ev{display:block;width:100%;text-align:left;background:var(--soft);border:0;border-left:3px solid var(--c);border-radius:3px;padding:2px 5px;margin-top:3px;font-size:11.5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev:hover{filter:brightness(.95)}
.cal .ev.x{text-decoration:line-through;opacity:.6}
.cal .more{font-size:11px;color:var(--muted);margin-top:2px}
.cal .addday{position:absolute;right:4px;top:4px;opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.cal .day:hover .addday,.cal .addday:focus-visible{opacity:1}
.obs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--bar,var(--gold))}
.card.hyg{--bar:var(--hires)}
.card h3{font-size:15px;line-height:1.25;font-family:"Segoe UI",system-ui,sans-serif}
.card .loc{color:var(--muted);font-size:12.5px}
.card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.card .stats b{display:block;font-size:15px}.card .stats span{font-size:11.5px;color:var(--muted)}
.contact{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;background:var(--panel)}
.contact .top{display:flex;justify-content:space-between;gap:8px}
.contact a{color:var(--blue);word-break:break-all}
@media (prefers-color-scheme:dark){.contact a{color:var(--focus)}}
.cn{width:100%;font-size:13px}
/* forms/modal */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.fld span{color:var(--muted)}
.fld input,.fld select,.fld textarea{font-weight:400;width:100%}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line);grid-column:1/-1;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(4,30,65,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border-radius:12px;width:min(580px,100%);padding:22px 24px;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal h2{font-size:21px;margin-bottom:4px}
.modal .x{float:right}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-ink);padding:10px 18px;border-radius:8px;font-weight:600;z-index:80;display:none}
.ro{width:100%;min-height:200px;font:12px/1.4 ui-monospace,Consolas,monospace}
.res a{color:var(--blue);font-weight:600}
@media (prefers-color-scheme:dark){.res a{color:var(--focus)}}
@media (max-width:980px){
  #app{grid-template-columns:1fr}
  #nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .brand{border:0;margin:0;padding:0 10px 0 0;flex-direction:row;align-items:center}.brand img{width:90px}.brand span{display:none}
  #nav nav{flex-direction:row;flex-wrap:wrap}.nv{width:auto;padding:6px 9px}.savestate{display:none}
  main{padding:18px 14px 50px}
  .grid2,.grid2.even,.hero{grid-template-columns:1fr}.hero>div+div{border-left:0;border-top:1px solid var(--line)}
  .ledger,.kpis{grid-template-columns:repeat(2,1fr)}.ledger>div,.kpis>div{border-top:1px solid var(--line)}
  .form{grid-template-columns:1fr}.cal .day{min-height:70px}.legend-row{margin-left:0}
}
</style>
</head>

<div id="app"><aside id="nav"></aside><main id="main"></main></div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>

/* ---------- roster (recruiter + contact per school) ---------- */
const RMAP={jessica:'jess',hillary:'amadi',chris:'destinee'};
const ALIAS={hillsboroughcommunitycollege:'hillsboroughcollege'};
const nrm=n=>String(n||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
function applyRoster(S){
  const old=S.recruiters||[];
  S.recruiters=REC_SEED.map(([id,name,track,budget,target])=>{const o=old.find(r=>r.id===id)||old.find(r=>RMAP[r.id]===id);return {id,name,track,budget:o?o.budget:budget,target:o?o.target:target}});
  const fix=id=>RMAP[id]||id;
  S.events.forEach(e=>e.recruiter=fix(e.recruiter));S.transfers.forEach(t=>t.recruiter=fix(t.recruiter));
  S.dental.concat(S.hygiene).forEach(s=>s.recruiter=fix(s.recruiter));
  const claimed={dental:new Set(),hygiene:new Set()};let added=0,newContacts=0;
  ROSTER.forEach(([name,seg,rid,contact,state,budget,grads])=>{
    const kind=seg?'hygiene':'dental',list=S[kind],k=nrm(name);
    let s=list.find(x=>!claimed[kind].has(x.id)&&(x.dashName===name||nrm(x.name)===k||ALIAS[nrm(x.name)]===k));
    if(!s)s=list.find(x=>{const n=nrm(x.name);return !claimed[kind].has(x.id)&&!x.dashName&&n.length>12&&k.length>12&&(n.startsWith(k)||k.startsWith(n))});
    if(!s){s=kind==='dental'?{id:'d'+uid(),loc:state,state,target:0,budget:budget||0,hires:0,notes:''}:{id:'h'+uid(),state,classSize:grads??null,goal:null,support:'Strategic',hires:0,budget:budget||0,notes:''};list.push(s);added++}
    claimed[kind].add(s.id);s.name=name;s.dashName=name;s.recruiter=rid;
    contact.split(/\s+\/\s+/).map(x=>x.trim()).filter(Boolean).forEach(cn=>{
      if(!S.contacts.some(c=>c.kind===kind&&c.schoolId===s.id&&c.name.toLowerCase()===cn.toLowerCase())){S.contacts.push({id:uid(),kind,schoolId:s.id,name:cn,title:'',email:'',phone:'',lastTouch:'',followUp:'',notes:''});newContacts++}});
  });
  S.dental.sort((a,b)=>a.name.localeCompare(b.name));S.hygiene.sort((a,b)=>a.name.localeCompare(b.name));
  S.rosterV=1;return {added,newContacts};
}

  try{ if(!window.storage&&window.localStorage){ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v);} }catch(e){}
  return null;
}

  saveMsg='Saving…'; paintSave();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const data=JSON.stringify(S);
    try{
      if(window.storage){ const r=await window.storage.set(KEY,data,true); saveMsg=r?'Saved for the whole team':'Could not save. Use Data & backup.'; }
      else if(window.localStorage){ localStorage.setItem(KEY,data); saveMsg='Saved on this device'; }
      else saveMsg='Not saved. Use Data & backup.';
    }catch(e){ saveMsg='Not saved in this view. Use Data & backup to keep your work.'; }
    paintSave();
  },500);
}

/* ---------- modal / toast ---------- */
function modal(html,wide){const root=$('#modal-root');const old=root.querySelector('.modal');const st=old?old.scrollTop:0;
  root.innerHTML=`<div class="scrim" data-scrim><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const m=root.querySelector('.modal');if(old)m.scrollTop=st;const f=m.querySelector('[autofocus],input:not([type=hidden]),select,textarea');if(f&&!old&&!f.dataset.sf)f.focus();}
function closeModal(){$('#modal-root').innerHTML='';ui.drawer=null}
function backFromForm(){if(ui.drawer)openDrawer();else closeModal()}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600)}
function confirmModal(msg,act,id,label='Delete'){modal(`<h2>Are you sure?</h2><p>${msg}</p><div class="formfoot" style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="${ui.drawer?'drawer-back':'close'}">Cancel</button><button class="btn primary" data-act="${act}" data-id="${esc(id)}">${label}</button></div>`)}
function dataModal(title,name,text,mime,note){dataBuf={name,text,mime};modal(`<button class="btn sm x" data-act="close">Close</button><h2>${esc(title)}</h2>${note?`<p class="muted">${note}</p>`:''}<textarea class="ro" readonly id="databuf">${esc(text.length>150000?'This file is large ('+Math.round(text.length/1024)+' KB), so it is not previewed here. Use Download or Copy.':text)}</textarea><div class="formfoot" style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="copy-buf">Copy</button><button class="btn primary" data-act="dl-buf">Download ${esc(name)}</button></div>`)}

/* ---------- csv ---------- */
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()!==''))}
const csvCell=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

/* ---------- filters ---------- */
function evMatches(e,f){
  if(f.scope!=='all'&&e.kind!==f.scope)return false;
  const r=recById(e.recruiter);
  if(f.track!=='all'&&(!r||(f.track==='doctor'?r.track!=='DOC':r.track!=='HYG')))return false;
  if(f.rec&&e.recruiter!==f.rec)return false;
  if(f.dental&&!(e.kind==='dental'&&e.schoolId===f.dental))return false;
  if(f.hyg&&!(e.kind==='hygiene'&&e.schoolId===f.hyg))return false;
  if(f.type&&e.type!==f.type)return false;
  if(f.status&&e.status!==f.status)return false;
  if(f.q&&!(e.name+' '+schoolName(e.kind,e.schoolId)+' '+(e.notes||'')).toLowerCase().includes(f.q.toLowerCase()))return false;
  return true;
}
function trMatches(t,f){
  if(f.scope!=='all'&&t.kind!==f.scope)return false;
  const r=recById(t.recruiter);
  if(f.track!=='all'&&(!r||(f.track==='doctor'?r.track!=='DOC':r.track!=='HYG')))return false;
  if(f.rec&&t.recruiter!==f.rec)return false;
  if(f.dental&&!(t.kind==='dental'&&t.schoolId===f.dental))return false;
  if(f.hyg&&!(t.kind==='hygiene'&&t.schoolId===f.hyg))return false;
  if(f.year&&String(t.gradYear)!==String(f.year))return false;
  if(f.q&&!(t.candidate+' '+(t.email||'')+' '+schoolName(t.kind,t.schoolId)).toLowerCase().includes(f.q.toLowerCase()))return false;
  return true;
}

/* ---------- dashboard math ---------- */
function dashData(f=ui.dash){
  const recs=S.recruiters.filter(r=>(f.scope==='all'||(f.scope==='dental'&&r.track==='DOC')||(f.scope==='hygiene'&&r.track==='HYG'))&&(!f.rec||r.id===f.rec));
  const rid=new Set(recs.map(r=>r.id));
  let dental=f.scope==='hygiene'?[]:S.dental.filter(s=>rid.has(s.recruiter)&&(!f.dental||s.id===f.dental));
  let hyg=f.scope==='dental'?[]:S.hygiene.filter(s=>rid.has(s.recruiter)&&(!f.hyg||s.id===f.hyg));
  if(f.dental&&!f.hyg)hyg=[]; if(f.hyg&&!f.dental)dental=[];
  const dset=new Set(dental.map(s=>s.id)),hset=new Set(hyg.map(s=>s.id));
  const inScope=x=>x.kind==='dental'?dset.has(x.schoolId):hset.has(x.schoolId);
  const evAll=S.events.filter(inScope);
  const ev=evAll.filter(e=>!f.type||e.type===f.type);
  const tr=S.transfers.filter(inScope);
  const schoolFilter=!!(f.dental||f.hyg);
  const sum=(a,fn)=>a.reduce((x,y)=>x+fn(y),0);
  const budget=schoolFilter?sum(dental,s=>s.budget||0)+sum(hyg,s=>s.budget||0):sum(recs,r=>r.budget);
  const target=schoolFilter?sum(dental,s=>s.target||0)+sum(hyg,s=>s.goal||0):sum(recs,r=>r.target);
  const hires=sum(dental,s=>s.hires)+sum(hyg,s=>s.hires);
  const inv=ev.filter(e=>e.status==='Invoiced');
  const spend=sum(inv,e=>+e.actualCost||0);
  const held=ev.filter(e=>e.status==='Held'||e.status==='Invoiced');
  const attendees=sum(held,e=>+e.attendees||0);
  const invAtt=sum(inv,e=>+e.attendees||0);
  const committed=sum(ev.filter(e=>e.status!=='Invoiced'&&e.status!=='Cancelled'),e=>(e.actualCost!=null&&e.actualCost!==''?+e.actualCost:+e.estCost)||0);
  const rows=recs.map(r=>{
    const myD=dental.filter(s=>s.recruiter===r.id),myH=hyg.filter(s=>s.recruiter===r.id);
    const b=schoolFilter?sum(myD,s=>s.budget||0)+sum(myH,s=>s.budget||0):r.budget;
    const t=schoolFilter?sum(myD,s=>s.target||0)+sum(myH,s=>s.goal||0):r.target;
    const sp=sum(ev.filter(e=>e.recruiter===r.id),spendEv);
    return {r,budget:b,target:t,spend:sp,hires:sum(myD,s=>s.hires)+sum(myH,s=>s.hires)};
  });
  return {recs,dental,hyg,inScope,ev,evAll,tr,budget,target,hires,spend,held,attendees,invCount:inv.length,invAtt,committed,rows,transfers:tr.length};
}
function barChart(rows){
  if(!rows.length)return '<div class="empty">No recruiters match these filters.</div>';
  const W=720,H=270,L=34,B=30,T=10,R=8;
  const max=Math.max(10,...rows.flatMap(r=>[r.hires,r.target])),top=Math.ceil(max/10)*10;
  const ih=H-T-B,iw=W-L-R,gw=iw/rows.length,bw=Math.min(16,gw/3.2);
  const y=v=>T+ih-(v/top)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Hires versus target by recruiter">`;
  for(let i=0;i<=5;i++){const v=top/5*i;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" style="fill:var(--muted)">${Math.round(v)}</text>`}
  rows.forEach((r,i)=>{const cx=L+gw*i+gw/2;
    s+=`<rect x="${cx-bw-1}" y="${y(r.hires)}" width="${bw}" height="${T+ih-y(r.hires)}" rx="2" style="fill:var(--hires)"><title>${esc(r.r.name)} hires: ${r.hires}</title></rect>`;
    s+=`<rect x="${cx+1}" y="${y(r.target)}" width="${bw}" height="${T+ih-y(r.target)}" rx="2" style="fill:var(--target)"><title>${esc(r.r.name)} target: ${r.target}</title></rect>`;
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(r.r.name.split(' ')[0])}</text>`});
  return s+'</svg>';
}
function donut(counts,selType){
  const total=counts.reduce((a,c)=>a+c[1],0);
  if(!total)return '<div class="empty">No events for these filters.<br><button class="link" data-nav="submit">Add an event</button></div>';
  let acc=0;
  const segs=counts.map(([t,n])=>{const p=n/total*100;const el=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${TYPES[t]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}" data-act="mix" data-type="${esc(t)}" style="cursor:pointer;opacity:${selType&&selType!==t?.25:1}"><title>${esc(t)}: ${n}</title></circle>`;acc+=p;return el}).join('');
  return `<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Event mix">${segs}<text x="21" y="23.5" text-anchor="middle" font-size="8">${total}</text></svg><ul class="legend">${counts.map(([t,n])=>`<li data-act="mix" data-type="${esc(t)}" style="--c:${TYPES[t]}"><i></i>${esc(t)}<em>${n}</em></li>`).join('')}</ul></div>`;
}

VIEWS.contacts=()=>{
  const f=ui.con;
  const all=[...(f.scope==='hygiene'?[]:S.dental.map(s=>({kind:'dental',s}))),...(f.scope==='dental'?[]:S.hygiene.map(s=>({kind:'hygiene',s})))];
  const q=f.q.toLowerCase();
  const list=all.filter(({kind,s})=>{
    if(f.dental&&!(kind==='dental'&&s.id===f.dental))return false; if(f.hyg&&!(kind==='hygiene'&&s.id===f.hyg))return false;
    if(f.rec&&s.recruiter!==f.rec)return false; if(f.state&&stateOf(kind,s)!==f.state)return false;
    const cons=S.contacts.filter(c=>c.kind===kind&&c.schoolId===s.id);
    if(f.show==='with'&&!cons.length)return false; if(f.show==='without'&&cons.length)return false;
    if(q&&!(s.name+' '+(s.loc||s.state||'')+' '+cons.map(c=>c.name+' '+(c.email||'')+' '+(c.title||'')).join(' ')).toLowerCase().includes(q))return false;
    return true});
  const shown=list.slice(0,f.limit);
  const card=({kind,s})=>{const cons=S.contacts.filter(c=>c.kind===kind&&c.schoolId===s.id);const t=sTarget(kind,s);
    return `<article class="card ${kind==='hygiene'?'hyg':''}"><div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between"><div><h3>${esc(s.name)}</h3><div class="loc">${esc(kind==='dental'?s.loc:s.state)}</div></div><span class="chip info" style="flex:none">${esc(recName(s.recruiter).split(' ')[0])}</span></div>
    <div class="stats"><div><b>${s.hires} / ${t}</b><span>Hires / goal</span></div><div><b>${evFor(kind,s.id).length}</b><span>Events</span></div><div><b>${trFor(kind,s.id).length}</b><span>Transfers</span></div><div><b>${kind==='dental'?money(s.budget):(s.classSize??'\u2013')}</b><span>${kind==='dental'?'Budget':'Class size'}</span></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><b>Contacts (${cons.length})</b><button class="btn sm" data-act="add-contact" data-kind="${kind}" data-sid="${s.id}">Add contact</button></div>
    ${cons.length?cons.map(contactRow).join(''):'<div class="muted" style="font-size:12.5px">No contacts yet. Add the people you work with at this school.</div>'}
    <label class="fld"><span>Notes</span><textarea class="cn" data-sf="notes" data-kind="${kind}" data-sid="${s.id}" placeholder="What should the next recruiter know about this school?">${esc(s.notes||'')}</textarea></label>
    <button class="btn sm" data-act="open-school" data-kind="${kind}" data-sid="${s.id}">Open full profile</button></article>`};
  const states=Object.keys(STATES);
  return head('School contacts',`${list.length} school${list.length===1?'':'s'} \u00b7 ${S.contacts.length} contact${S.contacts.length===1?'':'s'} on file. Add, edit, and track follow-ups on each card.`,'')+
  `<div class="filters">${seg('con.scope',[['all','All schools'],['dental','Dental'],['hygiene','Hygiene']],f.scope)}${search('con.q',f.q,'Search school, contact, or email')}${sel('con.show',[['all','All schools'],['with','With contacts'],['without','Needs a contact']],f.show,'Contact status')}</div>
   <div class="filters">${sel('con.dental',[['',`All dental schools (${S.dental.length})`],...S.dental.map(s=>[s.id,s.name])],f.dental,'Dental school')}${sel('con.hyg',[['',`All hygiene schools (${S.hygiene.length})`],...S.hygiene.map(s=>[s.id,s.name])],f.hyg,'Hygiene school')}${sel('con.rec',recOpts(),f.rec,'Recruiter')}${sel('con.state',[['','All states'],...states.map(c=>[c,STATES[c]])],f.state,'State')}</div>`+
  (shown.length?`<div class="cards">${shown.map(card).join('')}</div>`:'<div class="panel empty">No schools match these filters.</div>')+
  (list.length>shown.length?`<div style="text-align:center;margin-top:16px"><button class="btn" data-act="more-cards">Show more (${list.length-shown.length} left)</button></div>`:'');
};

VIEWS.events=()=>{

   <div class="filters">${search('ev.q',f.q,'Search events')}${sel('ev.rec',recOpts(),f.rec,'Recruiter')}${sel('ev.dental',[['','All dental schools'],...S.dental.map(s=>[s.id,s.name])],f.dental,'Dental school')}${sel('ev.hyg',[['','All hygiene schools'],...S.hygiene.map(s=>[s.id,s.name])],f.hyg,'Hygiene school')}${sel('ev.type',[['','All types'],...Object.keys(TYPES).map(t=>[t,t])],f.type,'Type')}${sel('ev.status',[['','All statuses'],...STATUSES.map(t=>[t,t])],f.status,'Status')}</div>
   <div class="panel kpis">${k('Events shown',list.length)+k('Open (estimated)',money(open))+k('Spend (invoiced)',money(spend))+k('Attendees',att)+k('2:1 transfers',tr)}</div>`+

  `<div class="sec">Hygiene events (${hl.length})</div><div class="panel tw"><table><thead><tr><th>Date</th><th>Event</th><th>Hygiene school</th><th>Recruiter</th><th>Type</th><th class="r">Cost</th><th class="r">Attend.</th><th class="r">2:1</th><th>Status</th><th></th></tr></thead><tbody>${hl.map(hRow).join('')||'<tr><td colspan="10" class="empty">No hygiene events match.</td></tr>'}</tbody></table></div>`;

/* ---------- dashboard link ---------- */
const normName=n=>String(n||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
const dashUnmapped=()=>S.dental.concat(S.hygiene).filter(s=>!s.dashName).length;
function linkDashboard(d){
  if(!d||!d.schools||!d.events||!d.budget||!d.grads||!d.settings)throw new Error('missing sections');
  DASH=d;
  let matched=0,added=0;
  [['dental','Dental'],['hygiene','Hygiene']].forEach(([kind,seg])=>{
    const list=S[kind],pool=d.schools.filter(x=>x.segment===seg),byNorm=new Map(pool.map(x=>[normName(x.name),x]));
    const used=new Set();
    list.forEach(s=>{if(s.dashName&&pool.some(x=>x.name===s.dashName)){used.add(s.dashName);return}
      const n=normName(s.name);let m=byNorm.get(n);
      if(!m)m=pool.find(x=>{const k=normName(x.name);return !used.has(x.name)&&k.length>12&&n.length>12&&(k.startsWith(n)||n.startsWith(k))});
      if(m){s.dashName=m.name;used.add(m.name);matched++}});
    pool.forEach(x=>{if(used.has(x.name))return;
      const grads=d.grads.filter(g=>g.school===x.name&&g.grads!=='').sort((a,b)=>b.year-a.year)[0];
      const bud=d.budget.filter(b=>b.school===x.name&&b.planned!=='').sort((a,b)=>b.year-a.year)[0];
      const base={id:(kind==='dental'?'d':'h')+uid(),name:x.name,dashName:x.name,recruiter:'',hires:0,notes:'',budget:bud?+bud.planned:0};
      list.push(kind==='dental'?{...base,loc:x.state||'',state:x.state||'',target:0}:{...base,state:x.state||'',classSize:grads?+grads.grads:null,goal:null,support:'Strategic'});added++});
    list.sort((a,b)=>a.name.localeCompare(b.name));
  });
  saveDash();persist();return {matched,added};
}
const dashRows=(statuses=['Held','Invoiced'])=>{
  const all=S.events.concat(...S.archives.map(a=>a.events.map(e=>({...e,_arch:a.names[e.kind+e.schoolId]}))));
  const trs=S.transfers.concat(...S.archives.map(a=>a.transfers));
  return all.filter(e=>statuses.includes(e.status)).map(e=>{
    const s=getSchool(e.kind,e.schoolId);const school=(s&&(s.dashName||s.name))||e._arch||'';
    const leads=e.leads!=null&&e.leads!==''?e.leads:'';
    return {date:e.date,school,type:e.type,format:e.format||'In-person',cost:e.actualCost!=null&&e.actualCost!==''?+e.actualCost:'',attendees:e.attendees!=null?+e.attendees:0,leads:leads===''?'':+leads,apps:'',hires:'',notes:e.name+(e.notes?' \u2013 '+e.notes:''),year:'',season:'',pbId:e.id,_mapped:!!(s&&s.dashName)};
  }).sort(byDate);
};

function resolveRec(v){v=(v||'').trim().toLowerCase();if(!v)return '';const r=S.recruiters.find(r=>r.id===v||r.name.toLowerCase()===v||r.name.toLowerCase().split(' ')[0]===v);return r?r.id:''}
function importSchools(kind,text){
  const rows=parseCSV(text);if(rows.length<2)return toast('Add a header row and at least one school.');
  const h=rows[0].map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_'));const col=n=>h.indexOf(n);
  const list=kind==='dental'?S.dental:S.hygiene;const have=new Set(list.map(s=>s.name.toLowerCase()));let add=0,skip=0;
  rows.slice(1).forEach(r=>{const name=(r[col('name')]||'').trim();if(!name||have.has(name.toLowerCase())){skip++;return}
    have.add(name.toLowerCase());const g=n=>col(n)>=0?(r[col(n)]||'').trim():'';
    if(kind==='dental')S.dental.push({id:'d'+uid(),name,loc:g('location'),recruiter:resolveRec(g('recruiter')),target:+g('target')||0,budget:+g('budget')||0,hires:0,notes:''});
    else{const st=g('state');S.hygiene.push({id:'h'+uid(),name,state:NAME2CODE[st.toLowerCase()]?STATES[NAME2CODE[st.toLowerCase()]]:(STATES[st.toUpperCase()]||st),recruiter:resolveRec(g('recruiter')),classSize:nn(g('class_size')),goal:nn(g('hire_goal')),support:SUPPORT.includes(g('support_level'))?g('support_level'):'Strategic',hires:0,budget:0,notes:''})}
    add++});
  list.sort((a,b)=>a.name.localeCompare(b.name));
  persist();closeModal();render();toast(`Added ${add} school${add===1?'':'s'}${skip?`, skipped ${skip}`:''}`);
}

    case 'team-edit':modal(teamForm());break;
    case 'archive-ask':modal(`<form data-form="archive"><h2>Archive current data</h2><p>Events, 2:1 transfers, and hire counts move into Archives and reset to zero. School contacts, notes, budgets, and targets stay in place.</p>${field('Archive name',`<input name="label" required value="CY ${CY} cycle">`)}<div class="formfoot" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Archive and start fresh</button></div></form>`);break;
    case 'view-archive':{const a=S.archives.find(x=>x.id===d.id);if(!a)break;modal(`<button class="btn sm x" data-act="close">Close</button><h2>${esc(a.label)}</h2><div class="muted">Archived ${fmtDate(a.date)}</div><div class="panel kpis" style="margin-top:14px"><div><div class="k">Hires</div><div class="v">${a.t.hires} / ${a.t.target}</div></div><div><div class="k">Budget</div><div class="v">${money(a.t.budget)}</div></div><div><div class="k">Spend</div><div class="v">${money(a.t.spend)}</div></div><div><div class="k">Attendees</div><div class="v">${a.t.attendees}</div></div><div><div class="k">Events held</div><div class="v">${a.t.held}</div></div></div><div class="sec">Events (${a.events.length})</div><div class="panel tw"><table><thead><tr><th>Date</th><th>Event</th><th>School</th><th class="r">Cost</th><th class="r">Attend.</th><th>Status</th></tr></thead><tbody>${a.events.sort(byDate).map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.name)}</td><td>${esc(a.names[e.kind+e.schoolId]||'')}</td><td class="r">${money(e.actualCost??e.estCost)}</td><td class="r">${e.attendees??'\u2013'}</td><td>${e.status}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No events in this archive.</td></tr>'}</tbody></table></div><div class="sec">Schools with hires (${a.hires.length})</div><div class="panel pad">${a.hires.map(h=>`<span class="chip" style="margin:2px">${esc(h.name)} \u00b7 ${h.hires}</span>`).join('')||'<span class="muted">No hires recorded.</span>'}</div>`,true);break}
    case 'export-archive':{const a=S.archives.find(x=>x.id===d.id);if(a)dataModal('Archive events','archive-events.csv',toCSV([['Date','Event','School type','School','Event type','Status','Estimated cost','Actual cost','Attendees'],...a.events.sort(byDate).map(e=>[e.date,e.name,e.kind,a.names[e.kind+e.schoolId],e.type,e.status,e.estCost,e.actualCost,e.attendees])]),'text/csv');break}
    case 'del-archive-ask':confirmModal('Delete this archive permanently?','del-archive',d.id);break;
    case 'del-archive':commit(()=>{S.archives=S.archives.filter(x=>x.id!==d.id)});closeModal();toast('Archive deleted');break;
    case 'del-resource':commit(()=>{S.resources=S.resources.filter(x=>x.id!==d.id)});break;
    case 'export':exportData(d.what);break;
    case 'dash-link-open':modal(`<form data-form="dash-link"><h2>Link dashboard data</h2><p class="muted">In the Campus Recruiting Dashboard, open the Data tab and choose Export all data (JSON). Load that file here. The Playbook matches its schools to the dashboard\u2019s names and adds any schools it is missing.</p><input type="file" accept=".json,application/json" id="dashfile" style="margin-bottom:8px"><div class="formfoot" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Link dashboard</button></div></form>`);break;
    case 'dash-review':{const rows=[];[['dental','Dental'],['hygiene','Hygiene']].forEach(([kind,seg])=>S[kind].filter(s=>!s.dashName).forEach(s=>{
        const spare=S[kind].filter(x=>x!==s&&x.dashName&&!x.recruiter&&!x.hires&&!x.notes&&!evFor(kind,x.id).length&&!trFor(kind,x.id).length&&!S.contacts.some(c=>c.kind===kind&&c.schoolId===x.id));
        const st=stateOf(kind,s);const opts=spare.filter(x=>!st||stateOf(kind,x)===st||!stateOf(kind,x));
        rows.push(`<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(kind==='dental'?s.loc:s.state)}</div></td><td><select name="m_${kind}_${s.id}"><option value="">Leave unmatched</option>${opts.map(x=>`<option value="${x.id}">${esc(x.dashName)}</option>`).join('')}</select></td></tr>`)}));
      modal(`<form data-form="dash-review"><h2>Match schools to the dashboard</h2><p class="muted">These Playbook schools have no exact match in the dashboard. Pick the dashboard school each one should report under. The duplicate the link added for it is merged away.</p><div class="tw"><table><thead><tr><th>Playbook school</th><th>Dashboard school</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="formfoot" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save matches</button></div></form>`);break}
    case 'dash-export':{const rows=dashRows();const d=JSON.parse(JSON.stringify(DASH));d.events=d.events.filter(r=>!r.pbId);rows.forEach(r=>{const {_mapped,...x}=r;d.events.push(x)});
      const un=rows.filter(r=>!r._mapped).length;
      dataModal('Updated dashboard file','campus-recruiting-data.json',JSON.stringify(d,null,1),'application/json',`${rows.length} held or invoiced event${rows.length===1?'':'s'} from the Playbook are included${un?`, ${un} of them at schools not matched to a dashboard name yet (they will show as Unmapped)`:''}. In the dashboard, open Data and choose Import data (JSON). Exporting again later replaces these rows rather than duplicating them.`);break}
    case 'dash-csv':{const rows=dashRows();dataModal('Events in dashboard format','playbook-events-for-dashboard.csv',toCSV([['Event date','School','Event type','Format','Cost ($)','Attendees','Leads captured','Applications attributed','Hires attributed','Event name / notes','Year (if no date)','Season'],...rows.map(r=>[r.date,r.school,r.type,r.format,r.cost,r.attendees,r.leads,r.apps,r.hires,r.notes,r.year,r.season])]),'text/csv','Same columns as the dashboard\u2019s Events table. Only held or invoiced events are included.');break}
    case 'dl-buf':downloadBuf();break;
    case 'copy-buf':copyBuf();break;
    case 'restore-open':modal(`<form data-form="restore"><h2>Restore from backup</h2><p class="muted">This replaces everything in the playbook with the contents of the backup.</p><input type="file" accept=".json,application/json" id="jsonfile" style="margin-bottom:8px"><textarea name="json" id="jsontext" style="min-height:160px" placeholder="Paste backup JSON here"></textarea><div class="formfoot" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Restore</button></div></form>`);break;
    case 'reset-ask':confirmModal('Reset the playbook to the starting school list? Events, contacts, transfers, resources, and archives will be erased. This cannot be undone.','reset','x','Reset playbook');break;
    case 'reset':S=seed();applyRoster(S);persist();closeModal();render();toast('Playbook reset');break;
  }
});
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v;if(k[0]==='con'&&k[1]!=='limit')o.con.limit=48}
document.addEventListener('input',e=>{const b=e.target.closest('[data-bind]');if(b){setPath(ui,b.dataset.bind,b.value);render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  const es=t.closest('[data-evstatus]');if(es){commit(()=>{S.events.find(x=>x.id===es.dataset.evstatus).status=t.value});return}
  const sf=t.closest('[data-sf]');
  if(sf){const s=getSchool(sf.dataset.kind,sf.dataset.sid);if(!s)return;const f=sf.dataset.sf;let v=sf.value;
    if(sf.dataset.num){v=v===''?null:Math.max(0,+v);if(['hires','target','budget'].includes(f)&&v===null)v=0}
    s[f]=v;persist();render();if(ui.drawer&&document.querySelector('.modal')&&!document.querySelector('form[data-form]'))openDrawer();return}
  if(t.name==='kind'&&t.form){const form=t.form;form.querySelectorAll('[data-kindseg] label').forEach(l=>l.classList.toggle('on',l.contains(t)));
    const ss=form.querySelector('select[name=schoolId]');if(ss)ss.innerHTML=schoolOptsHtml(t.value,'');
    const ev=form.querySelector('select[name=eventId]');if(ev)ev.innerHTML='<option value="">None</option>'+S.events.filter(x=>x.kind===t.value).sort(byDate).map(x=>`<option value="${x.id}">${esc(fmtDate(x.date)+' \u2013 '+x.name)}</option>`).join('');
    if(form.dataset.form==='event-new')ui.sub.type=t.value;return}
  if(t.name==='schoolId'&&t.form){const kind=(t.form.querySelector('input[name=kind]:checked')||t.form.querySelector('input[name=kind]')||{}).value;const s=kind&&getSchool(kind,t.value);const r=t.form.querySelector('select[name=recruiter]');if(s&&r&&s.recruiter)r.value=s.recruiter}
  if(t.id==='csvfile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$('#csvtext').value=fr.result};fr.readAsText(t.files[0])}
  if(t.id==='jsonfile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$('#jsontext').value=fr.result};fr.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f).entries());const k=f.dataset.form;
  const nz=x=>x===''||x==null?null:+x;
  if(k==='event-new'||k==='event-edit'){
    if(!v.schoolId||!v.recruiter)return toast('Choose a school and a recruiter.');
    const base={kind:v.kind,schoolId:v.schoolId,name:v.name.trim(),recruiter:v.recruiter,date:v.date,type:v.type,format:v.format||'In-person',estCost:nz(v.estCost)||0,goal:nz(v.goal),notes:v.notes};
    if(k==='event-new'){commit(()=>S.events.push({id:uid(),...base,status:'Planned',actualCost:null,attendees:null,leads:null,hd:null,wrap:''}));ui.sub={type:v.kind,date:''};toast('Event added');ui.ev=Object.assign(ui.ev,{});go('events')}
    else{commit(()=>Object.assign(S.events.find(x=>x.id===v.id),base,{status:v.status,actualCost:nz(v.actualCost),attendees:nz(v.attendees),leads:nz(v.leads),hd:nz(v.hd),wrap:v.wrap}));closeModal();toast('Changes saved')}
  }
  else if(k==='contact'){
    const rec={kind:v.kind,schoolId:v.schoolId,name:v.name.trim(),title:v.title,email:v.email,phone:v.phone,lastTouch:v.lastTouch,followUp:v.followUp,notes:v.notes};
    commit(()=>{if(v.id)Object.assign(S.contacts.find(c=>c.id===v.id),rec);else S.contacts.push({id:uid(),...rec})});backFromForm();toast('Contact saved');
  }
  else if(k==='transfer'){
    if(!v.schoolId||!v.recruiter)return toast('Choose a school and a recruiter.');
    const rec={kind:v.kind,schoolId:v.schoolId,candidate:v.candidate.trim(),email:v.email,recruiter:v.recruiter,gradYear:v.gradYear,to:v.to,eventId:v.eventId,notes:v.notes};
    commit(()=>{if(v.id)Object.assign(S.transfers.find(t=>t.id===v.id),rec);else S.transfers.push({id:uid(),...rec})});closeModal();toast('Transfer saved');
  }
  else if(k==='school'){
    const list=v.kind==='dental'?S.dental:S.hygiene;
    if(list.some(s=>s.name.toLowerCase()===v.name.trim().toLowerCase()))return toast('That school is already on the list.');
    commit(()=>{const s=v.kind==='dental'?{id:'d'+uid(),name:v.name.trim(),loc:v.loc,recruiter:v.recruiter,target:+v.target||0,budget:+v.budget||0,hires:0,notes:''}:{id:'h'+uid(),name:v.name.trim(),state:v.state,recruiter:v.recruiter,classSize:nz(v.classSize),goal:nz(v.goal),support:v.support,hires:0,budget:0,notes:''};list.push(s);list.sort((a,b)=>a.name.localeCompare(b.name))});closeModal();toast('School added');
  }
  else if(k==='import-schools')importSchools(v.kind,v.csv||'');
  else if(k==='team'){commit(()=>S.recruiters.forEach(r=>{r.name=(v['n_'+r.id]||r.name).trim();r.budget=+v['b_'+r.id]||0;r.target=+v['t_'+r.id]||0}));closeModal();toast('Budgets and targets saved')}
  else if(k==='resource'){let u=v.url.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;commit(()=>S.resources.push({id:uid(),title:v.title.trim(),url:u,cat:(v.cat||'').trim()||'General'}));toast('Resource added')}
  else if(k==='archive'){
    const t=totalsSnapshot(),names={};S.events.forEach(e=>names[e.kind+e.schoolId]=schoolName(e.kind,e.schoolId));
    const hires=[...S.dental.map(s=>({kind:'dental',name:s.name,hires:s.hires})),...S.hygiene.map(s=>({kind:'hygiene',name:s.name,hires:s.hires}))].filter(h=>h.hires>0);
    commit(()=>{S.archives.unshift({id:uid(),label:v.label.trim(),date:today(),t,events:S.events.slice(),transfers:S.transfers.slice(),hires,names});S.events=[];S.transfers=[];S.dental.forEach(s=>s.hires=0);S.hygiene.forEach(s=>s.hires=0)});closeModal();toast('Archived. Fresh start.');
  }
  else if(k==='dash-review'){let n=0;commit(()=>{Object.entries(v).forEach(([key,val])=>{if(!val)return;const [,kind,sid]=key.match(/^m_(dental|hygiene)_(.+)$/);const s=getSchool(kind,sid),dup=getSchool(kind,val);if(!s||!dup)return;s.dashName=dup.dashName;S[kind]=S[kind].filter(x=>x!==dup);n++})});closeModal();toast(`Matched ${n} school${n===1?'':'s'}`)}
  else if(k==='dash-link'){const fi=$('#dashfile');if(!fi||!fi.files[0])return toast('Choose the dashboard JSON file first.');const fr=new FileReader();fr.onload=()=>{try{const r=linkDashboard(JSON.parse(fr.result));closeModal();render();toast(`Linked. Matched ${r.matched} schools, added ${r.added}.`)}catch(x){toast('That file is not a dashboard export.')}};fr.readAsText(fi.files[0])}
  else if(k==='restore'){try{const o=JSON.parse(v.json);if(!o||!o.dental||!o.hygiene||!o.recruiters)throw 0;S=o;persist();closeModal();render();toast('Backup restored')}catch(x){toast('That file is not a Campus Playbook backup.')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});

/* ---------- boot ---------- */
(async function(){
  S=await loadState();let upgraded=false;
  if(!S){S=seed();applyRoster(S);upgraded=true}else if(!S.rosterV){applyRoster(S);upgraded=true}
  DASH=await loadDash();
  saveMsg=window.storage?'Saved for the whole team':(window.localStorage?'Saved on this device':'Not saved in this view. Use Data & backup.');
  try{if(!window.storage&&window.localStorage)localStorage.setItem('_t','1')}catch(e){saveMsg='Changes last until this tab closes. Use Data & backup.'}
  render();if(upgraded){persist();toast('Recruiters and contacts loaded for all 390 schools')}
})();
</script>
</body>
</html>
